replicaCount: 2

image:
  repository: ghcr.io/santhosh030502/task-api
  tag: latest
  pullPolicy: IfNotPresent

env:
  APP_ENV: dev

service:
  type: ClusterIP
  port: 80

containerPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70

ingress:
  enabled: false
  className: nginx
  host: task-api.local
