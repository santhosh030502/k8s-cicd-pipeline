name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/task-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  lint-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint helm/task-api
          helm lint helm/task-api -f helm/task-api/values-prod.yaml

      - name: Validate manifests with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -skip Kustomization k8s/
          helm template task-api helm/task-api | ./kubeconform -strict -summary

  build:
    needs: [test, lint-k8s]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE_NAME:$SHORT_SHA $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHORT_SHA
          docker push $IMAGE_NAME:latest

  # spin up a throwaway kind cluster and make sure the chart actually deploys
  deploy-test:
    needs: [test, lint-k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Build and load image into kind
        run: |
          docker build -t task-api:ci app
          kind load docker-image task-api:ci --name ci

      - name: Install chart
        run: |
          helm install task-api helm/task-api \
            --set image.repository=task-api \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 2m

      - name: Smoke test
        run: |
          kubectl get pods -o wide
          kubectl port-forward svc/task-api 8080:80 &
          sleep 5
          curl -sf localhost:8080/healthz
          curl -sf -X POST localhost:8080/tasks -H 'Content-Type: application/json' -d '{"title":"ci check"}'
          curl -sf localhost:8080/tasks

      - name: Debug on failure
        if: failure()
        run: |
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=task-api --tail=50
